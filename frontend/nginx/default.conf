map $http_x_forwarded_proto $vocabulary_trainer_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # Docker forwards host-loopback traffic through a private gateway. Trust only
    # those local/private hops when recovering the client address supplied by the
    # same-host TLS reverse proxy. The published port remains bound to 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Do not pass a client-supplied forwarding chain to the API. After the
        # real-ip module resolves it, send exactly one canonical client address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vocabulary_trainer_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Deck manifests can be large. The API keeps the 64 KiB limit for all
        # other routes and independently enforces a 10 MiB import limit.
        client_max_body_size 10m;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
